name: Rust CI/CD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: test-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: test-cargo-

    - name: Install Linux deps
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ cmake pkg-config libfontconfig1-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libssl-dev

    - name: Download assets (Linux x64)
      run: |
        mkdir -p bin-linux-x64
        gh release download Assets_Linux_x64 --dir bin-linux-x64 --repo ${{ github.repository }}
        chmod +x bin-linux-x64/*
        ln -s bin-linux-x64 bin
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run tests
      run: cargo test -- --test-threads=1

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Win-x64
            bin_dir: bin
            asset_tag: Assets_Windows_x64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Lin-x64
            bin_dir: bin-linux-x64
            asset_tag: Assets_Linux_x64
            flatpak_arch: x86_64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ matrix.label }}-cargo-

    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ cmake pkg-config libfontconfig1-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libssl-dev flatpak flatpak-builder

    - name: Download assets (Windows)
      if: runner.os == 'Windows'
      run: |
        New-Item -ItemType Directory -Force -Path bin
        gh release download ${{ matrix.asset_tag }} --pattern "*.exe" --dir bin --repo ${{ github.repository }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh

    - name: Download assets (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p ${{ matrix.bin_dir }}
        gh release download ${{ matrix.asset_tag }} --dir ${{ matrix.bin_dir }} --repo ${{ github.repository }}
        chmod +x ${{ matrix.bin_dir }}/*
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build full
      run: cargo build --release --target ${{ matrix.target }}

    - name: Prepare full binary (Windows)
      if: runner.os == 'Windows'
      run: Copy-Item target/${{ matrix.target }}/release/Oxytools.exe Oxytools_full_${{ matrix.label }}.exe
      shell: pwsh

    - name: Prepare full binary (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p stage
        cp target/${{ matrix.target }}/release/Oxytools stage/Oxytools_full_${{ matrix.label }}
        chmod +x stage/Oxytools_full_${{ matrix.label }}

    - name: Build Office
      run: cargo build --release --no-default-features --target ${{ matrix.target }}

    - name: Prepare Office binary (Windows)
      if: runner.os == 'Windows'
      run: Copy-Item target/${{ matrix.target }}/release/Oxytools.exe Oxytools_Office_${{ matrix.label }}.exe
      shell: pwsh

    - name: Prepare Office binary (Linux)
      if: runner.os == 'Linux'
      run: |
        cp target/${{ matrix.target }}/release/Oxytools stage/Oxytools_Office_${{ matrix.label }}
        chmod +x stage/Oxytools_Office_${{ matrix.label }}

    - name: Setup Flatpak runtime
      if: runner.os == 'Linux'
      run: |
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

    - name: Build Flatpaks
      if: runner.os == 'Linux'
      run: |
        for variant in full Office; do
          name="Oxytools_${variant}_${{ matrix.label }}"
          app_id="io.github.Promethyxx.Oxytools${variant^}"

          cat > "${name}.desktop" <<EOF
        [Desktop Entry]
        Type=Application
        Name=Oxytools ${variant}
        Exec=oxytools
        Categories=AudioVideo;Utility;
        Terminal=false
        EOF

          cat > "${name}.yaml" <<EOF
        app-id: ${app_id}
        runtime: org.freedesktop.Platform
        runtime-version: '24.08'
        sdk: org.freedesktop.Sdk
        command: oxytools
        finish-args:
          - --share=ipc
          - --share=network
          - --socket=x11
          - --socket=wayland
          - --device=dri
          - --filesystem=host
        modules:
          - name: oxytools
            buildsystem: simple
            build-commands:
              - install -Dm755 oxytools /app/bin/oxytools
              - install -Dm644 app.desktop /app/share/applications/${app_id}.desktop
            sources:
              - type: file
                path: stage/${name}
                dest-filename: oxytools
              - type: file
                path: ${name}.desktop
                dest-filename: app.desktop
        EOF

          flatpak-builder --user --force-clean --disable-rofiles-fuse --arch=${{ matrix.flatpak_arch }} --repo=repo-${name} build-${name} "${name}.yaml"
          flatpak build-bundle --arch=${{ matrix.flatpak_arch }} repo-${name} "${name}.flatpak" "${app_id}"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.label }}
        path: |
          Oxytools_*.exe
          Oxytools_*.flatpak
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version: $VERSION"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: List files
      run: ls -lh Oxytools_*

    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Oxytools v${{ steps.version.outputs.version }}
        body: |
          ## Platforms
          || Oxytools_full | Oxytools_Office |
          |---|:---:|:---:|
          | Linux x64 (Flatpak) | ✅ | ✅ |
          | Windows x64 | ✅ | ✅ |
        files: |
          Oxytools_*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
