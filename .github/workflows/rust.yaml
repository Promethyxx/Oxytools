name: Rust CI/CD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: test-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: test-cargo-

    - name: Install Linux deps
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ cmake pkg-config libfontconfig1-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libssl-dev

    - name: Download assets (Linux x64)
      run: |
        # Crée le dossier bin-linux-x64 attendu par include_bytes!
        mkdir -p bin-linux-x64
        gh release download Assets_Linux_x64 --dir bin-linux-x64 --repo ${{ github.repository }}
        chmod +x bin-linux-x64/*
        
        # Crée le lien symbolique "bin" vers "bin-linux-x64" au besoin
        ln -s bin-linux-x64 bin
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run tests
      run: cargo test --features api -- --test-threads=1

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Win_x64
            bin_dir: bin
            asset_tag: Assets_Windows_x64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Lin_x64
            bin_dir: bin-linux-x64
            asset_tag: Assets_Linux_x64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Lin_arm64
            bin_dir: bin-linux-arm
            asset_tag: Assets_Mac_ARM

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ matrix.label }}-cargo-

    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ cmake pkg-config libfontconfig1-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libssl-dev

    - name: Download assets (Windows)
      if: runner.os == 'Windows'
      run: |
        New-Item -ItemType Directory -Force -Path bin
        gh release download ${{ matrix.asset_tag }} --pattern "*.exe" --dir bin --repo ${{ github.repository }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh

    - name: Download assets (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p ${{ matrix.bin_dir }}
        gh release download ${{ matrix.asset_tag }} --dir ${{ matrix.bin_dir }} --repo ${{ github.repository }}
        chmod +x ${{ matrix.bin_dir }}/*
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build
      run: cargo build --profile dist --target ${{ matrix.target }}

    - name: Prepare Binary (Windows)
      if: runner.os == 'Windows'
      run: Copy-Item target/${{ matrix.target }}/dist/Oxytools.exe Oxytools_${{ matrix.label }}.exe
      shell: pwsh

    - name: Prepare Binary (Linux)
      if: runner.os == 'Linux'
      run: |
        cp target/${{ matrix.target }}/dist/Oxytools Oxytools_${{ matrix.label }}
        chmod +x Oxytools_${{ matrix.label }}

    - name: Build Office
      run: cargo build --profile dist --no-default-features --target ${{ matrix.target }}

    - name: Prepare Office Binary (Windows)
      if: runner.os == 'Windows'
      run: Copy-Item target/${{ matrix.target }}/dist/Oxytools.exe Oxytools_Office_${{ matrix.label }}.exe
      shell: pwsh

    - name: Prepare Office Binary (Linux)
      if: runner.os == 'Linux'
      run: |
        cp target/${{ matrix.target }}/dist/Oxytools Oxytools_Office_${{ matrix.label }}
        chmod +x Oxytools_Office_${{ matrix.label }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.label }}
        path: Oxytools_*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # nécessaire pour la signature keyless cosign (OIDC)

    steps:
    - uses: actions/checkout@v5

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version: $VERSION"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: List files
      run: ls -lh Oxytools_*

    - name: Générer les sommes de contrôle (SHA256SUMS)
      run: sha256sum Oxytools_* > SHA256SUMS.txt && cat SHA256SUMS.txt

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Générer le SBOM (CycloneDX)
      run: |
        cargo install cargo-cyclonedx --locked
        cargo cyclonedx --format json

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Signer les sommes de contrôle (keyless, via l'identité OIDC du workflow)
      run: |
        cosign sign-blob --yes \
          --output-signature SHA256SUMS.txt.sig \
          --output-certificate SHA256SUMS.txt.pem \
          SHA256SUMS.txt

    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Oxytools v${{ steps.version.outputs.version }}
        body: |
          ## Platforms
          || Oxytools | Oxytools_Office |
          |---|:---:|:---:|
          | Linux ARM64 | ✅ | ✅ |
          | Linux x64 | ✅ | ✅ |
          | Mac ARM64 | 🛠️ | 🛠️ |
          | Windows x64 | ✅ | ✅ |

          ## Vérifier l'intégrité d'un téléchargement
          ```
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```

          ## Vérifier l'authenticité (que le binaire vient bien de ce workflow GitHub Actions)
          ```
          cosign verify-blob SHA256SUMS.txt \
            --signature SHA256SUMS.txt.sig \
            --certificate SHA256SUMS.txt.pem \
            --certificate-identity-regexp "https://github.com/Promethyxx/Oxytools/.github/workflows/rust.yaml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          ```
        files: |
          Oxytools_*
          SHA256SUMS.txt
          SHA256SUMS.txt.sig
          SHA256SUMS.txt.pem
          *.cdx.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}