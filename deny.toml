# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[graph]
targets = []

# ════════════════════════════════════════════════════════════════════════
#  ADVISORIES — known vulnerabilities (RustSec) and unmaintained crates
# ════════════════════════════════════════════════════════════════════════
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste (macro helper) is unmaintained, pulled transitively by exr/image. No known vulnerability, just no more updates. No fix available; consider an alternative (pastey) if it becomes necessary." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz (font shaping) is unmaintained, pulled by resvg for SVG text rendering. No known vulnerability. No fix available; a possible alternative (harfrust) to evaluate later." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, pulled by resvg/fontdb for font rendering. No known vulnerability. No fix available; a possible alternative (skrifa) to evaluate later." },
]

# ════════════════════════════════════════════════════════════════════════
#  LICENSES — compatibility with GPL-3.0-or-later
# ════════════════════════════════════════════════════════════════════════
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "bzip2-1.0.6",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# ════════════════════════════════════════════════════════════════════════
#  BANS — duplicate versions and explicitly excluded crates
# ════════════════════════════════════════════════════════════════════════
[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

# ════════════════════════════════════════════════════════════════════════
#  SOURCES — official crates.io only
# ════════════════════════════════════════════════════════════════════════
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
